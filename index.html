<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ListForge</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        color: #222;
    }

    .app {
        width: 100%;
        max-width: 700px;
        margin: 25px auto;
        background: white;
        padding: 25px 35px 40px;
        min-height: 100vh;
    }

    .title {
        font-size: 25px;
        font-weight: bold;
        border: none;
        outline: none;
        width: 100%;
        margin-bottom: 4px;
    }

    .subtitle {
        font-size: 13px;
        color: #555;
        border: none;
        outline: none;
        width: 100%;
        margin-bottom: 25px;
    }

    .section {
        margin-top: 22px;
    }

    .section-header {
        display: flex;
        align-items: center;
    }

    .section-title {
        font-size: 14px;
        font-weight: bold;
        border: none;
        outline: none;
        width: 100%;
        padding: 5px 0;
        border-bottom: 1px solid #ccc;
    }

    .item {
        display: flex;
        align-items: center;
        min-height: 31px;
        border-bottom: 1px solid #ddd;
        font-size: 12px;
    }

    .item input[type="checkbox"] {
        width: 13px;
        height: 13px;
        margin: 0 9px 0 2px;
        cursor: pointer;
    }

    .item-text {
        flex: 1;
        outline: none;
        padding: 8px 2px;
    }

    .delete {
        border: none;
        background: transparent;
        color: #aaa;
        cursor: pointer;
        font-size: 15px;
        opacity: 0;
    }

    .item:hover .delete,
    .section:hover .delete {
        opacity: 1;
    }

    .delete:hover {
        color: red;
    }

    .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid #ccc;
    }

    button {
        border: 1px solid #aaa;
        background: white;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
        border-radius: 2px;
    }

    button:hover {
        background: #eee;
    }

    .primary {
        background: #222;
        color: white;
        border-color: #222;
    }

    @media print {
        body {
            background: white;
        }

        .app {
            margin: 0;
            max-width: none;
        }

        .controls,
        .delete {
            display: none !important;
        }
    }

    @media (max-width: 600px) {
        .app {
            margin: 0;
            padding: 20px;
        }

        .delete {
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div class="app">

    <input
        class="title"
        value="Cheklist Title"
        aria-label="Title"
    >

    <input
        class="subtitle"
        value="The List"
        aria-label="Description"
    >

    <div id="checklist"></div>

    <div class="controls">
        <button class="primary" onclick="addSection()">
            + Add a section
        </button>

        <button onclick="addItem()">
            + Add a element
        </button>

        <button onclick="window.print()">
            🖨 Print (or save it in PDF)
        </button>
    </div>

</div>

<script>

function addSection() {

    const section = document.createElement("div");
    section.className = "section";

    section.innerHTML = `
        <div class="section-header">
            <input
                class="section-title"
                value="New section"
            >

            <button
                class="delete"
                onclick="this.closest('.section').remove()"
            >×</button>
        </div>

        <div class="items"></div>
    `;

    document.getElementById("checklist").appendChild(section);
}


function addItem() {

    let sections = document.querySelectorAll(".section");

    if (sections.length === 0) {
        addSection();
        sections = document.querySelectorAll(".section");
    }

    const section = sections[sections.length - 1];
    const items = section.querySelector(".items");

    const item = document.createElement("div");
    item.className = "item";

    item.innerHTML = `
        <input type="checkbox">

        <div
            class="item-text"
            contenteditable="true"
        >Nuevo elemento</div>

        <button
            class="delete"
            onclick="this.closest('.item').remove()"
        >×</button>
    `;

    items.appendChild(item);

    item.querySelector(".item-text").focus();
}

</script>

</body>
</html>
